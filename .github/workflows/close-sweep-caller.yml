name: Close sweep

# Same-repo caller for the reusable close sweep. The daily run only reports;
# a manual dispatch with `apply` makes the changes.

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: Close and label issues instead of only reporting.
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  sweep:
    uses: ./.github/workflows/close-sweep.yml
    with:
      oio_ref: ${{ github.event.repository.default_branch }}
      apply: ${{ inputs.apply == true }}
    secrets:
      CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
